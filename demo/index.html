<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Slop Detector · Staged feed</title>
  <link rel="stylesheet" href="demo.css"><script src="controller.js" defer></script>
</head>
<body>
  <nav class="toolbar" aria-label="Demo controls">
    <div class="brand"><img src="icons/radar.svg" width="28" height="28" alt=""><strong>Slop Detector</strong><span>Screenshot studio</span></div>
    <div class="controls">
      <div class="segmented" aria-label="Feed"><button id="x" aria-pressed="true">X</button><button id="linkedin" aria-pressed="false">LinkedIn</button></div>
      <label>On slop <select id="demo-theme"><option value="stamp">Stamp</option><option value="fade">Fade out</option><option value="hide">Hide</option></select></label>
      <button id="settings-toggle" aria-expanded="false">Settings</button>
      <button id="capture" class="primary">Capture view</button>
    </div>
  </nav>
  <div class="instructions">Fictional people and posts. Preset example scores. Choose a view, then use Capture view to hide these controls. <kbd>Esc</kbd> brings them back.</div>
  <main class="stage-wrap">
    <section class="stage" aria-label="1280 by 800 screenshot canvas">
      <iframe id="feed" title="Staged X feed"></iframe>
      <aside id="settings-panel" hidden aria-label="Extension settings preview"><iframe id="settings" title="Slop Detector settings"></iframe></aside>
      <footer class="demo-note"><span>Slop Detector</span><span>Demo content · Fictional posts and example scores</span></footer>
    </section>
  </main>
</body>
</html>
